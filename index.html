<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #252547, #0b0b16 65%);
  color: white;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
  padding: 30px 0 60px;
}

h1 {
  text-align: center;
  font-size: clamp(32px, 6vw, 70px);
  margin: 10px 0;
}

.subtitle {
  text-align: center;
  opacity: .7;
  margin-bottom: 30px;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 13px 20px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: white;
  color: #111;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  opacity: .9;
}

button.active {
  background: #7c5cff;
  color: white;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.card {
  min-height: 330px;
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  background: #171725;
  box-shadow: 0 15px 45px rgba(0,0,0,.35);
}

.card img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  display: block;
  background: #252535;
}

.card-name {
  padding: 15px;
  text-align: center;
  font-size: 19px;
  font-weight: 800;
}

.loading {
  text-align: center;
  padding: 50px;
  opacity: .6;
}

#qrBox {
  display: none;
  margin: 30px auto;
  padding: 25px;
  width: min(350px, 90%);
  background: white;
  color: #111;
  border-radius: 20px;
  text-align: center;
}

#qrcode {
  margin: 20px auto;
  display: flex;
  justify-content: center;
}

#stats {
  text-align: center;
  opacity: .6;
  margin: 25px 0;
}

@media(max-width: 850px) {
  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 500px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 350px;
  }
}
</style>

<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.min.js"></script>

</head>

/* =========================================================
   REMOVE DUPLICATES
   ========================================================= */

function unique(list) {
  return [...new Set(
    list
      .map(x => x.trim())
      .filter(Boolean)
  )];
}

const PEOPLE = unique([
  ...YOUR_CURRENT_PEOPLE,
  ...EXTRA_PEOPLE
]);


/* =========================================================
   STATE
   ========================================================= */

let currentMode = "all";

let currentChoices = [];


/* =========================================================
   RANDOM
   ========================================================= */

function shuffle(array) {

  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
      [result[j], result[i]];
  }

  return result;
}


function getPool() {

  if (currentMode === "fiction") {
    return FICTIONAL_CHARACTERS;
  }

  if (currentMode === "men") {

    /*
      Sinu praeguses projektis võib meeste/naiste
      kategooria olla eraldi.

      Kui sul on need eraldi massiivid,
      ühenda need siin.
    */

    return PEOPLE;
  }

  if (currentMode === "women") {
    return PEOPLE;
  }

  return PEOPLE;
}


/* =========================================================
   IMAGE SEARCH
   =========================================================

   Wikipedia PageImages annab nime järgi lead-image.
*/

async function getCelebrityImage(name) {

  const url =
    "https://en.wikipedia.org/w/api.php" +
    "?action=query" +
    "&format=json" +
    "&origin=*" +
    "&prop=pageimages" +
    "&piprop=thumbnail" +
    "&pithumbsize=700" +
    "&redirects=1" +
    "&titles=" +
    encodeURIComponent(name);

  try {

    const response = await fetch(url);

    const data = await response.json();

    const pages =
      data?.query?.pages || {};

    const page =
      Object.values(pages)[0];

    if (page?.thumbnail?.source) {
      return page.thumbnail.source;
    }

  } catch (error) {
    console.error(
      "Image error:",
      name,
      error
    );
  }

  return createFallbackImage(name);
}


/* =========================================================
   FALLBACK IMAGE
   ========================================================= */

function createFallbackImage(name) {

  const initials =
    name
      .split(" ")
      .map(x => x[0])
      .slice(0,2)
      .join("")
      .toUpperCase();

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="700"
         height="700">

      <rect width="100%"
            height="100%"
            fill="#252535"/>

      <text x="50%"
            y="50%"
            dominant-baseline="middle"
            text-anchor="middle"
            fill="white"
            font-size="100"
            font-family="Arial">
        ${initials}
      </text>

    </svg>
  `;

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg);
}


/* =========================================================
   DISPLAY
   ========================================================= */

async function displayChoices() {

  const cards =
    document.getElementById("cards");

  cards.innerHTML = `
    <div class="loading">
      Finding pictures...
    </div>
  `;

  const pool = getPool();

  if (!pool.length) {

    cards.innerHTML = `
      <div class="loading">
        No people in this category yet.
      </div>
    `;

    return;
  }

  currentChoices =
    shuffle(pool).slice(0,4);

  cards.innerHTML = "";

  for (const name of currentChoices) {

    const card =
      document.createElement("div");

    card.className = "card";

    const img =
      document.createElement("img");

    img.alt = name;

    img.src =
      await getCelebrityImage(name);

    const title =
      document.createElement("div");

    title.className = "card-name";

    title.textContent = name;

    card.appendChild(img);
    card.appendChild(title);

    cards.appendChild(card);
  }

  updateStats();
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

  let count;

  if (currentMode === "fiction") {
    count = unique(FICTIONAL_CHARACTERS).length;
  } else {
    count = PEOPLE.length;
  }

  document.getElementById("stats")
    .textContent =
      `${count} choices available`;
}


/* =========================================================
   MODE
   ========================================================= */

function setMode(mode) {

  currentMode = mode;

  document
    .querySelectorAll(".controls button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  const id =
    mode === "all"
      ? "allBtn"
      : mode === "men"
      ? "menBtn"
      : mode === "women"
      ? "womenBtn"
      : "fictionBtn";

  document
    .getElementById(id)
    .classList.add("active");

  displayChoices();
}


/* =========================================================
   QR CODE
   ========================================================= */

function generateQR() {

  const qrBox =
    document.getElementById("qrBox");

  const qr =
    document.getElementById("qrcode");

  qr.innerHTML = "";

  /*
    Kui mäng on veebis hostitud,
    QR viib otse mängu URL-ile.
  */

  const gameURL =
    window.location.href;

  QRCode.toCanvas(
    document.createElement("canvas"),
    gameURL,
    {
      width: 240,
      margin: 2
    },
    function(error, canvas) {

      if (error) {
        console.error(error);
        return;
      }

      qr.appendChild(canvas);

    }
  );

  qrBox.style.display = "block";
}


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("allBtn")
  .onclick = () => setMode("all");

document
  .getElementById("menBtn")
  .onclick = () => setMode("men");

document
  .getElementById("womenBtn")
  .onclick = () => setMode("women");

document
  .getElementById("fictionBtn")
  .onclick = () => setMode("fiction");

document
  .getElementById("newBtn")
  .onclick = displayChoices;

document
  .getElementById("qrBtn")
  .onclick = generateQR;


/* =========================================================
   START
   ========================================================= */

displayChoices();

</script>

</body>
</html>
